# Documental — en Railway el root del service es el monorepo (""),
# build: npm --prefix apps/cliente ci && npm --prefix apps/cliente run build
# Staging ← main · Production ← production
[build]
builder = "NIXPACKS"
buildCommand = "npm --prefix apps/cliente ci && npm --prefix apps/cliente run build"
watchPatterns = ["apps/cliente/**", "shared/**"]

[deploy]
startCommand = "npm --prefix apps/cliente run start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
