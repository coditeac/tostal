# App Restaurant — Railway (documental)
# Root Directory = apps/restaurant · Volume /data
# Staging ← main · Production ← production
# Preferir settings en dashboard/API; buildCommand = npm run build (Nixpacks ya hace npm ci)

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"
watchPatterns = ["apps/restaurant/**", "shared/**"]

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/public/dias"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
