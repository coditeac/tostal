# Documental — root monorepo para incluir shared/
# build: npm --prefix apps/restaurant ci && npm --prefix apps/restaurant run build
# Volume /data · Staging ← main · Production ← production
[build]
builder = "NIXPACKS"
buildCommand = "npm --prefix apps/restaurant ci && npm --prefix apps/restaurant run build"
watchPatterns = ["apps/restaurant/**", "shared/**"]

[deploy]
startCommand = "npm --prefix apps/restaurant run start"
healthcheckPath = "/api/public/dias"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
