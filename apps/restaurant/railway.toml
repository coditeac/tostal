# App Restaurant (API + ops) — Railway
# En el servicio: Root Directory = apps/restaurant
# Entornos: Staging ← branch main · Production ← branch production
# Volumen persistente recomendado en /data → TOSTAL_DB_PATH=/data/tostal.sqlite

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"
watchPatterns = ["apps/restaurant/**", "shared/**"]
# better-sqlite3 necesita toolchain nativo (Nixpacks lo provee por defecto)

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/public/dias"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
